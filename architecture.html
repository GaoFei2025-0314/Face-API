<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>face_api 交互式架构图</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: #101b2e;
      --panel-strong: #15233a;
      --line: #2a3f5f;
      --text: #e7edf7;
      --muted: #91a2ba;
      --api: #4da3ff;
      --engine: #44d18d;
      --page: #b58cff;
      --ops: #ffb55c;
      --data: #38d6d6;
      --docs: #a8b3c7;
      --risk: #ff6370;
      --active: #ffe082;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: auto;
      background:
        radial-gradient(circle at 25% 15%, rgba(77, 163, 255, 0.14), transparent 30%),
        radial-gradient(circle at 75% 10%, rgba(68, 209, 141, 0.10), transparent 26%),
        linear-gradient(135deg, #08111f 0%, #0b1424 54%, #101827 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(620px, 1fr) 340px;
      height: 100vh;
      min-width: 1080px;
    }

    .sidebar,
    .details {
      background: rgba(16, 27, 46, 0.88);
      border-color: rgba(255, 255, 255, 0.08);
      border-style: solid;
      backdrop-filter: blur(16px);
      overflow: auto;
      transition: opacity 180ms ease, filter 180ms ease;
    }

    .sidebar {
      border-width: 0 1px 0 0;
      padding: 20px;
    }

    .details {
      border-width: 0 0 0 1px;
      padding: 24px;
    }

    .brand {
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand p,
    .hint,
    .detail-muted {
      color: var(--muted);
      line-height: 1.65;
    }

    .control-group {
      margin: 20px 0;
    }

    .control-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .button-list {
      display: grid;
      gap: 8px;
    }

    .placeholder {
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
    }

    button:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.095);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .choice {
      padding: 9px 11px;
    }

    .choice.active {
      border-color: rgba(255, 224, 130, 0.70);
      background: rgba(255, 224, 130, 0.13);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar button {
      padding: 9px 11px;
      text-align: center;
    }

    .toolbar button.active {
      border-color: rgba(255, 224, 130, 0.70);
      background: rgba(255, 224, 130, 0.13);
      color: var(--active);
    }

    .maintenance-note {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(145, 162, 186, 0.78);
      font-size: 12px;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      transition: box-shadow 180ms ease, background-size 180ms ease;
    }

    body.demo-mode .sidebar,
    body.demo-mode .details {
      opacity: 0.28;
      filter: saturate(0.62);
    }

    body.demo-mode .sidebar:hover,
    body.demo-mode .details:hover,
    body.demo-mode .sidebar:focus-within,
    body.demo-mode .details:focus-within {
      opacity: 0.72;
      filter: saturate(0.82);
    }

    body.demo-mode .canvas-wrap {
      background-size: 40px 40px;
      box-shadow: inset 0 0 0 1px rgba(255, 224, 130, 0.16);
    }

    .canvas-header {
      position: absolute;
      top: 18px;
      left: 22px;
      z-index: 2;
      pointer-events: none;
    }

    .canvas-header h2 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .canvas-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .lane {
      pointer-events: none;
    }

    .lane rect {
      fill: rgba(255, 255, 255, 0.025);
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 1;
    }

    .lane.active rect {
      fill: rgba(255, 224, 130, 0.055);
      stroke: rgba(255, 224, 130, 0.20);
    }

    .lane text {
      fill: rgba(231, 237, 247, 0.42);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    svg.dragging {
      cursor: grabbing;
    }

    .edge {
      stroke: rgba(145, 162, 186, 0.28);
      stroke-width: 2;
      fill: none;
      transition: stroke 160ms ease, opacity 160ms ease, stroke-width 160ms ease, filter 160ms ease;
    }

    .edge.primary {
      stroke: rgba(218, 232, 255, 0.62);
      stroke-width: 3.4;
    }

    .edge.active {
      stroke: var(--active);
      stroke-width: 5;
      filter: drop-shadow(0 0 10px rgba(255, 224, 130, 0.70));
    }

    .edge.dimmed,
    .node.dimmed {
      opacity: 0.24;
    }

    .node {
      cursor: pointer;
      transition: opacity 160ms ease, filter 160ms ease;
    }

    .node rect.card {
      rx: 8;
      ry: 8;
      stroke-width: 1.6;
      filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.30));
    }

    .node rect.accent {
      rx: 8;
      ry: 8;
    }

    .node.active rect.card {
      stroke: var(--active);
      stroke-width: 2.4;
      filter: drop-shadow(0 0 16px rgba(255, 224, 130, 0.52));
    }

    .node.playing rect.card {
      stroke: #fff3b0;
      stroke-width: 3;
      filter: drop-shadow(0 0 22px rgba(255, 224, 130, 0.72));
    }

    .node:hover rect.card {
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.16));
    }

    .node text {
      fill: var(--text);
      pointer-events: none;
    }

    .node .type-label {
      fill: rgba(231, 237, 247, 0.62);
      font-size: 12px;
      font-weight: 700;
    }

    .node .title {
      fill: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    .node.core .title {
      font-size: 19px;
    }

    .node .subtitle {
      fill: rgba(231, 237, 247, 0.70);
      font-size: 14px;
    }

    .node .file-label {
      fill: rgba(145, 162, 186, 0.78);
      font-size: 12px;
    }

    .details h2 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      margin: 8px 8px 8px 0;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
    }

    .detail-summary {
      margin: 14px 0 0;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
    }

    .detail-summary strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 13px;
    }

    .detail-summary p {
      margin: 0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .detail-box {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.035);
    }

    .detail-section {
      margin-top: 22px;
    }

    .detail-section h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--text);
    }

    .detail-section ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.75;
    }

    .detail-section code {
      color: #d7e6ff;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1px 4px;
    }

    @media (max-width: 1180px) {
      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 250px minmax(520px, 1fr);
        grid-template-rows: 68vh auto;
        height: auto;
        min-width: 0;
        min-height: 100vh;
      }

      .details {
        grid-column: 1 / -1;
        border-width: 1px 0 0;
        min-height: 320px;
      }
    }

    @media (max-width: 760px) {
      .app {
        display: block;
        min-width: 0;
      }

      .sidebar,
      .details {
        border-width: 0 0 1px;
        width: 100%;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar button {
        width: 100%;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .canvas-wrap {
        height: 68vh;
        min-height: 520px;
      }

      .maintenance-note {
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <section class="brand">
        <h1>face_api 架构图</h1>
        <p>用一张可交互架构图讲清楚本地人脸识别 REST API 的边界、流程、运行和文档入口。</p>
      </section>

      <section class="control-group">
        <h2 class="control-title">角色视图</h2>
        <div class="button-list" id="roleButtons">
          <div class="placeholder">角色按钮将在图谱数据加载后显示。</div>
        </div>
      </section>

      <section class="control-group">
        <h2 class="control-title">流程高亮</h2>
        <div class="button-list" id="flowButtons">
          <div class="placeholder">流程按钮将在图谱数据加载后显示。</div>
        </div>
      </section>

      <section class="control-group">
        <h2 class="control-title">操作</h2>
        <div class="toolbar">
          <button type="button" id="demoMode" aria-pressed="false">演示模式</button>
          <button type="button" id="playFlow" aria-pressed="false" disabled>播放当前流程</button>
          <button type="button" id="exportSvg">导出 SVG</button>
          <button type="button" id="resetView">复位视图</button>
          <button type="button" id="clearFocus">清除高亮</button>
        </div>
      </section>

      <p class="hint">滚轮缩放，拖动画布平移，拖拽节点调整位置，点击节点查看说明。</p>
      <p class="hint maintenance-note">维护提示：接口、启动方式、存储结构或页面入口变化时，请同步更新架构图。</p>
    </aside>

    <section class="canvas-wrap">
      <div class="canvas-header">
        <h2 id="viewTitle">新同事视图</h2>
        <p id="viewSubtitle">先理解系统边界和主链路。</p>
      </div>
      <svg id="graph" viewBox="0 0 1320 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="face_api interactive architecture graph">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(145, 162, 186, 0.72)"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g id="lanes"></g>
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>
    </section>

    <aside class="details" id="details">
      <h2>face_api 总览</h2>
      <p class="detail-muted">这里展示当前架构总览；后续交互步骤会启用节点详情切换。</p>
    </aside>
  </main>

    const state = {
      selectedNodeId: "overview",
      activeRole: "newcomer",
      activeFlow: "",
      demoMode: false,
      isPlaying: false,
      playStepIndex: -1,
      playTimer: 0,

    function byId(id) {
      return nodes.find((node) => node.id === id);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function updateTransform() {
      viewport.setAttribute(
        "transform",
        `translate(${state.transform.x} ${state.transform.y}) scale(${state.transform.scale})`
      );
    }

    function typeOf(node) {
      return nodeTypes[node.type] || nodeTypes.docs;
    }

    function sizeOf(node) {
      return node.size === "core"
        ? { width: 260, height: 112 }
        : { width: 230, height: 98 };
    }

    function centerOf(node) {
      const size = sizeOf(node);
      return { x: node.x + size.width / 2, y: node.y + size.height / 2 };
    }

    function activeFlowSteps() {
      const flow = flows[state.activeFlow];
      return flow && Array.isArray(flow.steps) ? flow.steps : [];
    }

    function currentPlayStep() {
      const steps = activeFlowSteps();
      if (!state.isPlaying || state.playStepIndex < 0 || state.playStepIndex >= steps.length) {
        return null;
      }
      return steps[state.playStepIndex];
    }

    function activeLaneIds() {
      if (!state.activeFlow) {
        return new Set();
      }
      const ids = new Set();
      edges.forEach((edge) => {
        if (!edge.flows.includes(state.activeFlow)) {
          return;
        }
        const from = byId(edge.from);
        const to = byId(edge.to);
        if (from) ids.add(from.lane);
        if (to) ids.add(to.lane);
      });
      return ids;
    }

    function isNodeActive(nodeId) {
      const step = currentPlayStep();
      if (step) {
        return step.nodeId === nodeId;
      }
      if (!state.activeFlow) {
        return false;
      }
      return edges.some((edge) => edge.flows.includes(state.activeFlow) && (edge.from === nodeId || edge.to === nodeId));
    }

    function isEdgeActive(edge) {
      const step = currentPlayStep();
      if (step) {
        return Array.isArray(step.edgeIds) && step.edgeIds.includes(edge.id);
      }
      return Boolean(state.activeFlow && edge.flows.includes(state.activeFlow));
    }

    function renderLanes() {
      const active = activeLaneIds();
      laneLayer.innerHTML = lanes.map((lane) => `
        <g class="lane${active.has(lane.id) ? " active" : ""}">
          <rect x="54" y="${lane.y}" width="1212" height="${lane.height}" rx="10" ry="10"></rect>
          <text x="72" y="${lane.y + 25}">${escapeHtml(lane.label)}</text>
        </g>
      `).join("");
    }

    function renderEdges() {
      edgeLayer.innerHTML = edges.map((edge) => {
        const fromNode = byId(edge.from);
        const toNode = byId(edge.to);
        if (!fromNode || !toNode) {
          return "";
        }
        const from = centerOf(fromNode);
        const to = centerOf(toNode);
        const active = isEdgeActive(edge);
        const dimmed = state.activeFlow && !active;
        return `
          <path
            class="edge ${edge.kind === "primary" ? "primary" : "secondary"}${active ? " active" : ""}${dimmed ? " dimmed" : ""}"
            data-edge-id="${escapeHtml(edge.id)}"
            d="M ${from.x} ${from.y} C ${(from.x + to.x) / 2} ${from.y}, ${(from.x + to.x) / 2} ${to.y}, ${to.x} ${to.y}"
            marker-end="url(#arrow)"
          ></path>
        `;
      }).join("");
    }

    function renderNodes() {
      nodeLayer.innerHTML = nodes.map((node) => {
        const type = typeOf(node);
        const size = sizeOf(node);
        const playing = currentPlayStep()?.nodeId === node.id;
        const active = state.selectedNodeId === node.id || isNodeActive(node.id);
        const dimmed = state.activeFlow && !active;
        return `
          <g class="node ${node.size === "core" ? "core" : "normal"}${active ? " active" : ""}${playing ? " playing" : ""}${dimmed ? " dimmed" : ""}" data-node-id="${escapeHtml(node.id)}" transform="translate(${node.x} ${node.y})">
            <rect class="card" width="${size.width}" height="${size.height}" fill="${type.fill}" stroke="${type.color}"></rect>
            <rect class="accent" width="${size.width}" height="4" fill="${type.color}"></rect>
            <text class="type-label" x="16" y="22">${escapeHtml(type.label)}</text>
            <text class="title" x="16" y="46">${escapeHtml(node.title)}</text>
            <text class="subtitle" x="16" y="68">${escapeHtml(node.subtitle)}</text>
            <text class="file-label" x="16" y="${size.height - 16}">${escapeHtml(node.fileLabel || "")}</text>
          </g>
        `;
      }).join("");
    }

    function list(items) {
      return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function listCompact(items) {
      return `<ul>${items.slice(0, 3).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function renderDetails() {
      const node = byId(state.selectedNodeId) || byId("overview");
      const type = typeOf(node);
      const step = currentPlayStep();
      const stepNote = step
        ? `<section class="detail-summary">
            <strong>播放步骤</strong>
            <p class="detail-muted">${escapeHtml(flows[state.activeFlow].label)} ${state.playStepIndex + 1}/${activeFlowSteps().length}：${escapeHtml(step.title)}</p>
          </section>`
        : "";
      details.innerHTML = `
        <h2>${escapeHtml(node.title)}</h2>
        <span class="tag" style="border: 1px solid ${type.color}; color: ${type.color};">${escapeHtml(type.label)}</span>
        ${stepNote}
        <section class="detail-summary">
          <strong>模块定位</strong>
          <p class="detail-muted">${escapeHtml(node.summary)}</p>
        </section>
        <section class="detail-summary">
          <strong>为什么重要</strong>
          <p class="detail-muted">${escapeHtml(node.talkTrack || "演示时用它说明当前模块在系统里的职责。")}</p>
        </section>
        <section class="detail-section detail-grid">
          <div class="detail-box">
            <h3>输入</h3>
            ${listCompact(node.inputs)}
          </div>
          <div class="detail-box">
            <h3>输出</h3>
            ${listCompact(node.outputs)}
          </div>
        </section>
        <section class="detail-section">
          <h3>关联文件 / 文档</h3>
          ${list(node.links)}
        </section>
        <section class="detail-section">
          <h3>注意事项</h3>
          ${list(node.notes)}
        </section>
      `;
    }

    function renderGraph() {
      renderLanes();
      renderEdges();
      renderNodes();
      renderDetails();
    }

    function renderControls() {
      const roleButtons = document.getElementById("roleButtons");
      const flowButtons = document.getElementById("flowButtons");
      const demoButton = document.getElementById("demoMode");
      const playButton = document.getElementById("playFlow");
      const role = roles[state.activeRole] || roles.newcomer;
      const step = currentPlayStep();
      const flow = flows[state.activeFlow];

      roleButtons.innerHTML = Object.entries(roles).map(([id, roleOption]) => `
        <button type="button" class="choice${state.activeRole === id ? " active" : ""}" data-role="${escapeHtml(id)}">
          ${escapeHtml(roleOption.label)}
        </button>
      `).join("");

      flowButtons.innerHTML = Object.entries(flows).map(([id, flow]) => `
        <button type="button" class="choice${state.activeFlow === id ? " active" : ""}" data-flow="${escapeHtml(id)}">
          ${escapeHtml(flow.label)}
        </button>
      `).join("");

      demoButton.classList.toggle("active", state.demoMode);
      demoButton.setAttribute("aria-pressed", state.demoMode ? "true" : "false");
      demoButton.textContent = state.demoMode ? "退出演示" : "演示模式";

      playButton.disabled = !state.activeFlow || activeFlowSteps().length === 0;
      playButton.classList.toggle("active", state.isPlaying);
      playButton.setAttribute("aria-pressed", state.isPlaying ? "true" : "false");
      playButton.textContent = state.isPlaying ? "停止播放" : "播放当前流程";

      document.getElementById("viewTitle").textContent = role.title;
      document.getElementById("viewSubtitle").textContent = step && flow
        ? `${flow.label}：${step.title}`
        : role.subtitle;
    }

    function renderDemoMode() {
      document.body.classList.toggle("demo-mode", state.demoMode);
    }

    function toggleDemoMode() {
      state.demoMode = !state.demoMode;
      renderDemoMode();
      renderControls();
    }

    function stopPlayback(options = {}) {
      if (state.playTimer) {
        window.clearTimeout(state.playTimer);
        state.playTimer = 0;
      }
      state.isPlaying = false;
      state.playStepIndex = -1;
      if (!options.skipRender) {
        renderControls();
        renderGraph();
      }
    }

    function showPlaybackStep() {
      if (state.playTimer) {
        window.clearTimeout(state.playTimer);
        state.playTimer = 0;
      }

      const steps = activeFlowSteps();
      const step = currentPlayStep();
      if (!step) {
        stopPlayback();
        return;
      }

      state.selectedNodeId = step.nodeId;
      renderControls();
      renderGraph();

      state.playTimer = window.setTimeout(() => {
        if (!state.isPlaying) {
          return;
        }
        if (state.playStepIndex >= steps.length - 1) {
          stopPlayback();
          return;
        }
        state.playStepIndex += 1;
        showPlaybackStep();
      }, PLAY_INTERVAL_MS);
    }

    function startPlayback() {
      const steps = activeFlowSteps();
      if (!state.activeFlow || steps.length === 0) {
        return;
      }
      stopPlayback({ skipRender: true });
      state.isPlaying = true;
      state.playStepIndex = 0;
      showPlaybackStep();
    }

    function togglePlayback() {
      if (state.isPlaying) {
        stopPlayback();
        return;
      }
      startPlayback();
    }

    function exportSvg() {
      const clone = graph.cloneNode(true);
      clone.classList.remove("dragging");
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", "1320");
      clone.setAttribute("height", "760");

      const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
      style.textContent = SVG_EXPORT_STYLE;
      clone.insertBefore(style, clone.firstChild);

      const source = `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(clone)}`;
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const suffix = state.activeFlow || state.activeRole || "overview";
      link.href = url;
      link.download = `face_api-architecture-${suffix}.svg`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    function setRole(roleId) {
      const role = roles[roleId];
      if (!role) {
        return;
      }
      stopPlayback({ skipRender: true });
      state.activeRole = roleId;
      state.activeFlow = "";
      state.selectedNodeId = role.focusNode;
      renderControls();
      renderGraph();
    }

    function setFlow(flowId) {
      const flow = flows[flowId];
      if (!flow) {
        return;
      }
      stopPlayback({ skipRender: true });
      state.activeFlow = flowId;
      state.selectedNodeId = flow.focusNode;
      renderControls();
      renderGraph();
    }

    function clearFocus() {
      stopPlayback({ skipRender: true });
      const role = roles[state.activeRole] || roles.newcomer;
      state.activeFlow = "";
      state.selectedNodeId = role.focusNode;
      renderControls();
      renderGraph();
    }

    function resetView() {
      stopPlayback({ skipRender: true });
      state.transform = { x: 0, y: 0, scale: 1 };
      updateTransform();
      renderControls();
      renderGraph();
    }

    function svgPoint(event) {
      const point = graph.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(graph.getScreenCTM().inverse());
    }

    function clientPoint(event) {
      const point = svgPoint(event);
      return {
        x: (point.x - state.transform.x) / state.transform.scale,
        y: (point.y - state.transform.y) / state.transform.scale
      };
    }

    document.getElementById("roleButtons").addEventListener("click", (event) => {
      const button = event.target.closest("[data-role]");
      if (button) {
        setRole(button.dataset.role);
      }
    });

    document.getElementById("flowButtons").addEventListener("click", (event) => {
      const button = event.target.closest("[data-flow]");
      if (button) {
        setFlow(button.dataset.flow);
      }
    });

    document.getElementById("demoMode").addEventListener("click", toggleDemoMode);
    document.getElementById("playFlow").addEventListener("click", togglePlayback);
    document.getElementById("exportSvg").addEventListener("click", exportSvg);
    document.getElementById("resetView").addEventListener("click", resetView);
    document.getElementById("clearFocus").addEventListener("click", clearFocus);

    graph.addEventListener("wheel", (event) => {
      event.preventDefault();
      const scaleDelta = event.deltaY > 0 ? 0.92 : 1.08;
      const nextScale = Math.min(1.8, Math.max(0.55, state.transform.scale * scaleDelta));
      const pointer = svgPoint(event);
      const worldX = (pointer.x - state.transform.x) / state.transform.scale;
      const worldY = (pointer.y - state.transform.y) / state.transform.scale;
      state.transform.x = pointer.x - worldX * nextScale;
      state.transform.y = pointer.y - worldY * nextScale;
      state.transform.scale = nextScale;
      updateTransform();
    }, { passive: false });

    graph.addEventListener("pointerdown", (event) => {
      const nodeElement = event.target.closest(".node");
      state.moved = false;
      state.pointerStart = { x: event.clientX, y: event.clientY };
      graph.setPointerCapture(event.pointerId);
      graph.classList.add("dragging");

      if (nodeElement) {
        state.draggingNodeId = nodeElement.dataset.nodeId;
        const point = clientPoint(event);
        const node = byId(state.draggingNodeId);
        if (!node) {
          state.draggingNodeId = "";
          graph.classList.remove("dragging");
          return;
        }
        state.dragStart = { x: point.x - node.x, y: point.y - node.y };
        return;
      }

      const point = svgPoint(event);
      state.draggingCanvas = true;
      state.dragStart = {
        x: point.x - state.transform.x,
        y: point.y - state.transform.y
      };
    });

    graph.addEventListener("pointermove", (event) => {
      if (!state.draggingNodeId && !state.draggingCanvas) {
        return;
      }
      state.moved = state.moved || Math.hypot(event.clientX - state.pointerStart.x, event.clientY - state.pointerStart.y) > 3;

      if (state.draggingNodeId) {
        const point = clientPoint(event);
        const node = byId(state.draggingNodeId);
        if (!node) {
          return;
        }
        node.x = point.x - state.dragStart.x;
        node.y = point.y - state.dragStart.y;
        renderGraph();
        return;
      }

      if (state.draggingCanvas) {
        const point = svgPoint(event);
        state.transform.x = point.x - state.dragStart.x;
        state.transform.y = point.y - state.dragStart.y;
        updateTransform();
      }
    });

    graph.addEventListener("pointerup", (event) => {
      graph.classList.remove("dragging");
      graph.releasePointerCapture(event.pointerId);

      if (state.draggingNodeId && !state.moved) {
        stopPlayback({ skipRender: true });
        state.selectedNodeId = state.draggingNodeId;
        renderControls();
        renderGraph();
      }

      state.draggingNodeId = "";
      state.draggingCanvas = false;
    });

    graph.addEventListener("pointercancel", (event) => {
      graph.classList.remove("dragging");
      graph.releasePointerCapture(event.pointerId);
      state.draggingNodeId = "";
      state.draggingCanvas = false;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        clearFocus();
      }
      if (event.key.toLowerCase() === "r") {
        resetView();
      }
    });

    renderControls();
    renderDemoMode();
    updateTransform();
    renderGraph();
  </script>
</body>
</html>
